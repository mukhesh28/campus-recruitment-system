{% extends "base.html" %}{% block title %}Change Password{% endblock %}
{% block content %}<div class="card form-card"><h2>🔑 Change Account Password</h2>
<form method="post">{{ csrf_field() }}<label>Current Password</label><input name="current" type="password" required>
<label>New Password</label><input name="password" type="password" required><label>Confirm New Password</label><input name="confirm" type="password" required>
<button class="btn primary">Update Password</button></form></div>{% endblock %}
